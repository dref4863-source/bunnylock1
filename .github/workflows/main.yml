name: Compilar APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Usar espejo de Google para evitar error 403
        run: |
          mkdir -p ~/.gradle
          cat << 'EOF' > ~/.gradle/init.gradle
          allprojects {
              buildscript {
                  repositories {
                      maven { url "https://maven-central.storage-download.googleapis.com/maven2/" }
                  }
              }
              repositories {
                  maven { url "https://maven-central.storage-download.googleapis.com/maven2/" }
              }
          }
          EOF

      - name: Dar permisos a Gradle
        run: chmod +x gradlew

      - name: Compilar APK Debug
        run: ./gradlew assembleDebug -x lint -x lintVitalRelease --stacktrace

      - name: Subir APK listo
        uses: actions/upload-artifact@v4
        with:
          name: BunnyLock-APK
          path: app/build/outputs/apk/debug/*.apk
